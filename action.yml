name: 'PrufGate Verification Engine'
description: 'Universal Anti-Fabrication, Anti-Reward-Hacking, Contract Guard, BOLA & Diff Verification Engine'
author: 'PrufGate Maintainers'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  profile:
    description: 'core runs Engines 1-5 and matches CLI check, MCP fast_scan and editor scans; battery adds diff review and external scanners.'
    required: false
    default: 'battery'
  allow_external_ai:
    description: 'Explicitly permit AI adjudication when the trusted configuration enables it. Sends finding messages and bounded source windows to the configured provider.'
    required: false
    default: 'false'
  battery:
    description: 'Verification mode: fast (changed files), review/full (entire workspace), bola, test-audit'
    required: false
    default: 'fast'
  target_url:
    description: 'Optional target URL for active dynamic 2-token BOLA probing'
    required: false
    default: ''
  sarif_upload:
    description: 'Automatically upload generated SARIF 2.1.0 report to GitHub Code Scanning'
    required: false
    default: 'true'
  fail_on_blocker:
    description: 'Fail the workflow step when P0/P1 blocker findings are detected'
    required: false
    default: 'true'
  execution:
    description: 'Execution mode: auto (native when all dependencies are installed, otherwise container), native, or container. Container mode always honors image.'
    required: false
    default: 'auto'
  image:
    description: 'Container image used in container mode. The default is the signed release image of this version; an action pinned to an unreleased commit needs an image built from that commit.'
    required: false
    default: 'ghcr.io/guardianvigil-labs/prufgate:1.4.0'
  base_ref:
    description: 'Git ref that changed files are compared with in fast mode. Defaults to the pull request base branch (origin/<base>). Check out with fetch-depth: 0 so that ref exists.'
    required: false
    default: ''
  job_summary:
    description: 'Write a short summary of the run (verdict, findings, facts about the change) to the job summary page'
    required: false
    default: 'true'
  pr_comment:
    description: 'Keep the same summary as one pull request comment, updated on every run. Needs permissions: pull-requests: write. A pull request from a fork gets a read-only token, so no comment is posted there (a warning, not a failure).'
    required: false
    default: 'false'
  github_checks:
    description: 'Publish a separate Check Run with changed-line annotations and coverage. Requires checks: write. Off by default; fork pull requests are skipped.'
    required: false
    default: 'false'
  checks_token:
    description: 'Token for the optional Check Run step only. Read only when github_checks is true.'
    required: false
    default: ${{ github.token }}
  github_token:
    description: 'Token used to post the pull request comment. Read only when pr_comment is true.'
    required: false
    default: ${{ github.token }}

outputs:
  scan_status:
    description: 'Canonical scan status: clean, findings, incomplete, or error'
    value: ${{ steps.run-prufgate.outputs.scan_status }}
  result_path:
    description: 'Versioned JSON result including coverage, explanations and privacy metadata'
    value: ${{ steps.run-prufgate.outputs.result_path }}
  sarif_path:
    description: 'Absolute path to the synthesized SARIF 2.1.0 report'
    value: ${{ steps.run-prufgate.outputs.sarif_path }}
  markdown_path:
    description: 'Absolute path to the synthesized Markdown report'
    value: ${{ steps.run-prufgate.outputs.markdown_path }}
  verdict:
    description: 'Overall audit verdict: PASSED, FAILED (blockers), or ERROR (execution incomplete)'
    value: ${{ steps.run-prufgate.outputs.verdict }}
  exit_code:
    description: 'Exit code of the gate: 0 clean, 1 blocking findings, 2 PrufGate could not run'
    value: ${{ steps.run-prufgate.outputs.exit_code }}
  execution_mode:
    description: 'Selected execution mode: native or container'
    value: ${{ steps.run-prufgate.outputs.execution_mode }}

runs:
  using: 'composite'
  steps:
    - name: Run PrufGate Verification
      id: run-prufgate
      shell: bash
      env:
        PRUFGATE_IMAGE: ${{ inputs.image }}
        TARGET_URL: ${{ inputs.target_url }}
        PRUFGATE_BASE_REF: ${{ inputs.base_ref }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
        PRUFGATE_BATTERY: ${{ inputs.battery }}
        FAIL_ON_BLOCKER: ${{ inputs.fail_on_blocker }}
        PRUFGATE_EXECUTION: ${{ inputs.execution }}
        PRUFGATE_PROFILE: ${{ inputs.profile }}
        ALLOW_EXTERNAL_AI: ${{ inputs.allow_external_ai }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        bash "${ACTION_PATH}/scripts/run_action.sh"

    - name: Write the PrufGate summary
      if: always() && (inputs.job_summary == 'true' || inputs.pr_comment == 'true') && hashFiles('reports/prufgate.sarif') != ''
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
        PRUFGATE_IMAGE: ${{ inputs.image }}
        EXECUTION_MODE: ${{ steps.run-prufgate.outputs.execution_mode }}
        PRUFGATE_BASE_REF: ${{ inputs.base_ref }}
        GATE_EXIT_CODE: ${{ steps.run-prufgate.outputs.exit_code }}
        JOB_SUMMARY: ${{ inputs.job_summary }}
        PR_COMMENT: ${{ inputs.pr_comment }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        # The token reaches this step only when the comment is wanted.
        PRUFGATE_GITHUB_TOKEN: ${{ inputs.pr_comment == 'true' && inputs.github_token || '' }}
      run: |
        set +e
        # The summary reports the result; the verdict and exit code above stay as they are.
        ARGS=(pr-summary)
        [ -n "${GATE_EXIT_CODE}" ] && ARGS+=(--exit-code "${GATE_EXIT_CODE}")
        if [ "${PR_COMMENT}" = "true" ]; then
          if [ -n "${PR_NUMBER}" ]; then
            ARGS+=(--post-comment --pr "${PR_NUMBER}")
          else
            echo "::notice::pr_comment is on, but this run is not for a pull request: no comment posted."
          fi
        fi
        SUMMARY_FILE="${RUNNER_TEMP:-/tmp}/prufgate-summary.md"
        if [ "${EXECUTION_MODE}" = native ]; then
          python3 -I "${ACTION_PATH}/prufgate/cli.py" "${ARGS[@]}" "${GITHUB_WORKSPACE}" > "${SUMMARY_FILE}"
          RC=$?
        else
          docker run --rm \
            -e PRUFGATE_UID="$(id -u)" \
            -e PRUFGATE_GID="$(id -g)" \
            -e PRUFGATE_BASE_REF \
            -e GITHUB_BASE_REF \
            -e GITHUB_REPOSITORY \
            -e GITHUB_API_URL \
            -e PRUFGATE_GITHUB_TOKEN \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            "${PRUFGATE_IMAGE}" python3 -I /tools/prufgate/prufgate/cli.py "${ARGS[@]}" /workspace > "${SUMMARY_FILE}"
          RC=$?
        fi
        if [ "${JOB_SUMMARY}" = "true" ] && [ -s "${SUMMARY_FILE}" ]; then
          cat "${SUMMARY_FILE}" >> "${GITHUB_STEP_SUMMARY}"
        fi
        if [ "${RC}" -ne 0 ]; then
          echo "::warning::PrufGate could not write or post its summary (exit ${RC}); the gate result is unchanged. See the log above."
        fi

    - name: Publish PrufGate Check Run
      if: always() && inputs.github_checks == 'true' && hashFiles('reports/prufgate-result.json') != ''
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_API_URL: ${{ github.api_url }}
        PRUFGATE_IMAGE: ${{ inputs.image }}
        EXECUTION_MODE: ${{ steps.run-prufgate.outputs.execution_mode }}
        PRUFGATE_BASE_REF: ${{ inputs.base_ref }}
        PRUFGATE_CHECKS_TOKEN: ${{ inputs.github_checks == 'true' && inputs.checks_token || '' }}
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        if [ "${EVENT_NAME}" = pull_request ] && [ "${HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY}" ]; then
          echo '::notice::Check publication skipped for a fork pull request. The local scan result remains available.'
          exit 0
        fi
        ARGS=(github-check --post-check --repo "${GITHUB_REPOSITORY}")
        [ -n "${PRUFGATE_BASE_REF}" ] && ARGS+=(--base "${PRUFGATE_BASE_REF}")
        if [ -z "${PRUFGATE_BASE_REF}" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then ARGS+=(--base "origin/${GITHUB_BASE_REF}"); fi
        if [ "${EXECUTION_MODE}" = native ]; then
          python3 -I "${ACTION_PATH}/prufgate/cli.py" "${ARGS[@]}" --workspace "${GITHUB_WORKSPACE}" --result "${GITHUB_WORKSPACE}/reports/prufgate-result.json"
        else
          docker run --rm \
            -e PRUFGATE_UID="$(id -u)" -e PRUFGATE_GID="$(id -g)" \
            -e GITHUB_API_URL -e PRUFGATE_CHECKS_TOKEN \
            -v "${GITHUB_WORKSPACE}:/workspace" "${PRUFGATE_IMAGE}" \
            python3 -I /tools/prufgate/prufgate/cli.py "${ARGS[@]}" --workspace /workspace --result /workspace/reports/prufgate-result.json
        fi

    - name: Upload SARIF to GitHub Code Scanning
      if: always() && inputs.sarif_upload == 'true' && hashFiles('reports/prufgate.sarif') != ''
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: ${{ github.workspace }}/reports/prufgate.sarif
        category: 'prufgate'
