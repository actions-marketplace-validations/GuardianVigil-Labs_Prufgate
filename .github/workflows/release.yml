name: Release

# Runs only when a maintainer pushes a v* tag to the public repository (the tag
# ruleset lets only admins create one). The only stored token is the Marketplace one below;
# PyPI accepts the packages through Trusted Publishing (OIDC), the image is
# signed keyless with Sigstore, and provenance and SBOM attestations are signed
# the same way. Order: checks -> build -> PyPI (owner approval, environment
# `pypi`) -> image -> GitHub release, and checks -> vscode -> Marketplace
# (owner approval, environment `vscode-marketplace`, secret VSCE_PAT).
# How to verify: SECURITY.md.
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    name: Checks on Python ${{ matrix.python }}
    # Never from a fork or a copy of this repository.
    if: github.repository == 'GuardianVigil-Labs/Prufgate'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          # 3.9 is not built for the newest runner image.
          - { python: '3.9', os: ubuntu-24.04 }
          - { python: '3.14', os: ubuntu-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The leak guard's commit check needs the history.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: The tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: test "v$(python3 -c 'import prufgate; print(prufgate.__version__)')" = "${TAG}"
      - name: Self-check, unit tests and the leak guard
        run: |
          python3 -m pip install --require-hashes -r .github/ci-requirements.txt
          python3 prufgate/cli.py --self-check
          python3 -m unittest discover -s tests

  build:
    name: Build the wheel and sdist
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Build
        run: |
          python3 -m venv /tmp/tools
          /tmp/tools/bin/pip install --require-hashes -r .github/release-requirements.txt
          /tmp/tools/bin/python -m build
          /tmp/tools/bin/twine check --strict dist/*
      - name: Install the wheel in a fresh venv and run it
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # No pip inside, so the SBOM below lists only what the wheel installs.
          python3 -m venv --without-pip /tmp/smoke
          python3 -m pip --python /tmp/smoke/bin/python install dist/*.whl
          test "$(/tmp/smoke/bin/prufgate --version)" = "prufgate ${TAG#v}"
          /tmp/smoke/bin/prufgate --self-check
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | /tmp/smoke/bin/prufgate-mcp | grep -q "\"version\": \"${TAG#v}\""
      - name: Build the zipapp and run it outside the checkout
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Same commit, same PyYAML sdist (hash-locked, from PyPI): same bytes.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" python3 scripts/build_pyz.py --out pyz/prufgate.pyz
          cd /tmp
          test "$(python3 -I "${GITHUB_WORKSPACE}/pyz/prufgate.pyz" --version)" = "prufgate ${TAG#v}"
          python3 -I "${GITHUB_WORKSPACE}/pyz/prufgate.pyz" --self-check
      - name: SBOM of the installed wheel
        run: |
          mkdir sbom
          /tmp/tools/bin/cyclonedx-py environment --of JSON -o sbom/prufgate-wheel.cdx.json /tmp/smoke/bin/python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      # Its own artifact: the PyPI job uploads everything in `dist`.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pyz
          path: pyz/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The owner approves this job; PyPI trusts only this workflow in this environment.
    environment:
      name: pypi
      url: https://pypi.org/p/prufgate
    permissions:
      id-token: write  # Trusted Publishing to PyPI
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Trusted Publishing: no token. PEP 740 attestations are uploaded by default.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  image:
    name: Build, push and sign the image
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read            # check out the repository
      packages: write           # push to GHCR
      id-token: write           # keyless signing and attestation
      attestations: write       # store the provenance attestation
      artifact-metadata: write  # record the image as an artifact of this run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tags
        id: tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          image=ghcr.io/guardianvigil-labs/prufgate
          version="${TAG#v}"
          tags="${image}:${version}"
          # A pre-release (1.1.0-rc.1) gets only its own tag.
          if [[ "${version}" != *-* ]]; then
            tags="${tags},${image}:${version%.*},${image}:latest"
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (amd64, arm64) with an SBOM and provenance
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless, GitHub OIDC)
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  vscode:
    name: Build the VS Code extension
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache in a release job. v4 caches only when asked; package-manager-cache
      # keeps it off (and tells zizmor so) if the pin moves to v5, which caches by default.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: The extension version matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: test "v$(node -p "require('./package.json').version")" = "${TAG}"
      - name: Build, typecheck and test
        run: |
          npm run build
          npm run typecheck
          npm test
      - name: Package the .vsix
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir "${GITHUB_WORKSPACE}/vsix"
          npx --no-install vsce package --no-dependencies --out "${GITHUB_WORKSPACE}/vsix/prufgate-${TAG#v}.vsix"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: vsix/
          if-no-files-found: error

  marketplace:
    name: Publish to the VS Code Marketplace
    # Publish only after the GitHub release has attested and attached this exact .vsix.
    needs: [vscode, release]
    # The Marketplace takes no pre-release versions (1.1.0-rc.1): those ship on the GitHub release only.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    # The owner approves this job; VSCE_PAT is stored only in this environment.
    environment:
      name: vscode-marketplace
      url: https://marketplace.visualstudio.com/items?itemName=GuardianVigil.prufgate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: editors/vscode
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the locked vsce
        working-directory: editors/vscode
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: vsix/
      - name: Publish the packaged .vsix
        working-directory: editors/vscode
        env:
          TAG: ${{ github.ref_name }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT}" ]; then
            echo "::error::VSCE_PAT is not set in the vscode-marketplace environment; nothing was published."
            exit 1
          fi
          # vsce reads the token from VSCE_PAT; it is never on the command line.
          npx --no-install vsce publish --packagePath "${GITHUB_WORKSPACE}/vsix/prufgate-${TAG#v}.vsix"

  release:
    name: GitHub release
    needs: [build, image, vscode]
    runs-on: ubuntu-latest
    permissions:
      contents: write           # create the release
      id-token: write           # sign the attestations
      attestations: write       # store the provenance and SBOM attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pyz
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom/
      - name: Provenance of the wheel, sdist, zipapp and VS Code extension
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: SBOM attestation of the wheel
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.whl
          # One literal path: sbom-path is not a glob.
          sbom-path: sbom/prufgate-wheel.cdx.json
      - name: Checksums and notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          (cd dist && sha256sum -- * > ../SHA256SUMS)
          awk -v h="## [${version}]" 'index($0, h) == 1 {on = 1; next} on && /^## \[/ {exit} on' CHANGELOG.md > NOTES.md
          test -s NOTES.md
          cat >> NOTES.md <<EOF

          ## Install

          - \`pipx install prufgate==${version}\` or \`pip install prufgate==${version}\`
          - One file, Python 3.9+ only: \`python3 prufgate.pyz --version\` (verify it first, below)
          - \`docker run --rm -v "\$PWD:/workspace" ghcr.io/guardianvigil-labs/prufgate:${version}\`
          - GitHub Action: \`uses: GuardianVigil-Labs/Prufgate@${TAG}\` (pin the commit SHA of this tag)
          - VS Code: \`code --install-extension GuardianVigil.prufgate\`, or \`code --install-extension prufgate-${version}.vsix\` from this release

          ## Verify

          \`SHA256SUMS\` lists the wheel and sdist, which are the files on PyPI, \`prufgate.pyz\`, and \`prufgate-${version}.vsix\`, the file on the VS Code Marketplace. The image is signed keyless with Sigstore. The wheel, the sdist, the zipapp, the .vsix and the image carry build provenance; the wheel (\`prufgate-wheel.cdx.json\`) and the image carry an SBOM:

          \`\`\`sh
          sha256sum -c SHA256SUMS
          gh attestation verify prufgate-${version}-py3-none-any.whl --repo ${GITHUB_REPOSITORY}
          gh attestation verify prufgate-${version}-py3-none-any.whl --repo ${GITHUB_REPOSITORY} \\
            --bundle prufgate-${version}-py3-none-any.whl.intoto.jsonl   # offline
          gh attestation verify prufgate.pyz --repo ${GITHUB_REPOSITORY}
          gh attestation verify prufgate-${version}.vsix --repo ${GITHUB_REPOSITORY}
          cosign verify ghcr.io/guardianvigil-labs/prufgate:${version} \\
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify oci://ghcr.io/guardianvigil-labs/prufgate:${version} --repo ${GITHUB_REPOSITORY}
          \`\`\`

          Details: "Verify a release" in SECURITY.md.
          EOF
      - name: Provenance files for the release
        # Each <file>.intoto.jsonl holds that file's signed attestations, so a
        # release can be verified offline: gh attestation verify <file> --bundle <file>.intoto.jsonl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in dist/*.whl dist/*.tar.gz dist/*.pyz dist/*.vsix; do
            gh attestation download "${f}" --repo "${GITHUB_REPOSITORY}" >/dev/null
            mv "sha256:$(sha256sum "${f}" | cut -d' ' -f1).jsonl" "${f}.intoto.jsonl"
            gh attestation verify "${f}" --bundle "${f}.intoto.jsonl" --repo "${GITHUB_REPOSITORY}"
          done
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=()
          if [[ "${TAG}" == *-* ]]; then pre=(--prerelease); fi
          gh release create "${TAG}" dist/* sbom/prufgate-wheel.cdx.json SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" --verify-tag --title "PrufGate ${TAG#v}" --notes-file NOTES.md "${pre[@]}"
