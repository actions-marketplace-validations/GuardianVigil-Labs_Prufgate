name: PrufGate Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vscode-extension:
    name: VS Code extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install locked extension dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile extension
        run: npm run build
      - name: Typecheck extension
        run: npm run typecheck
      - name: Test extension
        run: npm test
      - name: Set up Python for integration consistency checks
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install locked scanner dependencies
        run: python -m pip install --require-hashes -r ../../requirements.txt
      - name: Check editor and real CLI result consistency
        shell: bash
        env:
          PRUFGATE_TEST_PYTHON: python
        run: npm run test:integration

  python-versions:
    name: Unit tests on Python ${{ matrix.python }}${{ matrix.label }}
    # Python 3.9 is the oldest supported version and is not built for the
    # newest runner image, so that leg stays on 24.04. macOS runs the newest
    # Python: paths, symlinked temporary folders and process handling differ there.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: '3.9', os: ubuntu-24.04, label: '' }
          - { python: '3.14', os: ubuntu-latest, label: '' }
          - { python: '3.14', os: macos-latest, label: ' (macOS)' }
          - { python: '3.14', os: windows-latest, label: ' (Windows)' }
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Self-check and unit tests
        # `python` is the setup-python interpreter on every runner.
        shell: bash
        run: |
          # Windows: UTF-8 mode (the default from Python 3.15, PEP 686), so tests decode PrufGate's
          # UTF-8 output as such. tests/test_console.py still checks a cp1252 stream directly.
          if [ "$RUNNER_OS" = "Windows" ]; then export PYTHONUTF8=1; fi
          python -m pip install --require-hashes -r .github/ci-requirements.txt
          python prufgate/cli.py --self-check
          python -m unittest discover -s tests

  self-test:
    name: Self-Checks & Engine Verifications
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the changed-files scope and the commit hygiene check need the base commit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install PyYAML & Ruff
        run: |
          python3 -m pip install --require-hashes -r .github/ci-requirements.txt

      - name: Verify All 6 Core Engines Self-Check
        run: |
          python3 prufgate/cli.py --self-check

      - name: Run Unit & Public Hygiene Test Suite
        env:
          # The commits this run brings in, checked by tests/test_public_repo_hygiene.py.
          # A repository's first push (before is all zeros) and a manual run check every commit up to github.sha.
          PRUFGATE_HYGIENE_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || github.event.before && github.event.before != '0000000000000000000000000000000000000000' && format('{0}..{1}', github.event.before, github.sha) || github.sha }}
        run: |
          python3 -m unittest discover -s tests -v

      - name: Lint Python Modules with Ruff
        run: |
          ruff check --config configs/ruff.toml prufgate/ tests/

      - name: Verify frozen external corpus and measure upstream agreement
        run: |
          python3 scripts/build_evaluation_corpus.py
          python3 prufgate/cli.py evaluate --cases bench/testdata/independent --independent-only --format json --output reports/independent-evaluation.json

      - name: Validate Shell Script Execution Bits & Syntax
        run: |
          chmod +x install.sh bin/prufgate prufgate.sh entrypoint.sh runners/*.sh
          sh -n install.sh
          bash -n bin/prufgate
          bash -n prufgate.sh
          bash -n entrypoint.sh
          for script in runners/*.sh; do
            bash -n "$script"
          done

      - name: Test Universal 1-Command Installer & Native CLI
        run: |
          INSTALL_DIR=/tmp/test_ci_bin ./install.sh
          /tmp/test_ci_bin/prufgate --help
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            /tmp/test_ci_bin/prufgate check --changed
          else
            /tmp/test_ci_bin/prufgate check
          fi
          rm -rf /tmp/test_ci_bin

      # The gate on PrufGate itself runs from the checkout (a self-scan). A pull request
      # checks its changes against the base branch; a push or a manual run checks the
      # whole tree, so a single-commit history needs no HEAD~1.
      - name: PrufGate gate on this repository
        run: |
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            PRUFGATE_BASE_REF="origin/${GITHUB_BASE_REF}" ./prufgate.sh fast
          else
            ./prufgate.sh full
          fi

      # The image scans small sample repositories built at run time, as a user's would be.
      # Scanning PrufGate's own source from the image is not a self-scan, so its rule
      # examples would be reported.
      - name: Build & Execute PrufGate Container Image
        run: |
          docker build -t prufgate:latest -f Dockerfile .
          docker run --rm prufgate:latest /tools/prufgate/bin/prufgate --help
          bash tests/image_smoke.sh prufgate:latest

      - name: Report hygiene tests inside the image
        run: docker run --rm -v "${PWD}:/w" -w /w --entrypoint python3 prufgate:latest -m unittest -v tests.test_report_hygiene

      - name: Make the SARIF paths repository-relative
        if: always() && hashFiles('reports/prufgate.sarif') != ''
        run: |
          sudo chown -R "$(id -u)" reports
          sed -i -e 's#file:///workspace/##g' -e "s#file://${PWD}/##g" reports/prufgate.sarif

      - name: Upload PrufGate findings to code scanning
        if: >-
          always() && hashFiles('reports/prufgate.sarif') != '' &&
          (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/prufgate.sarif
          category: prufgate
